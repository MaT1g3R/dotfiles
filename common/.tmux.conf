# ==============================================================================
# TMUX CONFIGURATION
# Base16 Oceanic Next Theme | Vim Keybindings | TPM Plugin Integration
# ==============================================================================

# ------------------------------------------------------------------------------
# 1. General & Server Settings
# ------------------------------------------------------------------------------
# Modern terminal & True Color (RGB / 24-bit color) support
set -g default-terminal "tmux-256color"
set -as terminal-features ",xterm-256color:RGB"
set -as terminal-features ",tmux-256color:RGB"
set -as terminal-overrides ",xterm*:Tc"

# Zero escape delay for responsive Vim modal switching
set -s escape-time 0

# Increase repeat time limit for repeatable keys (-r)
set -g repeat-time 600

# Focus events enabled for terminals that support them (vital for vim autoread)
set -g focus-events on

# History limit
set -g history-limit 50000

# Enable mouse support (scrolling, pane resizing, selecting)
set -g mouse on

# Auto renumber windows when one is closed
set -g renumber-windows on

# Start window and pane numbering at 1 instead of 0 for easier keyboard reach
set -g base-index 1
setw -g pane-base-index 1

# Bell and activity alerts
set -g monitor-activity on
set -g visual-activity off
set -g visual-bell off
set -g bell-action none

# Set default shell to fish / user shell
set -g default-command "${SHELL}"

# ------------------------------------------------------------------------------
# 2. Key Bindings & Prefix
# ------------------------------------------------------------------------------
# Prefix key: Ctrl-Space
unbind C-b
set -g prefix C-Space
bind C-Space send-prefix

# Fast config reload
bind r source-file ~/.tmux.conf \; display-message "tmux.conf reloaded!"

# Split panes using | and - (or v and s matching Vim splits), preserving cwd
unbind '"'
unbind %
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind v split-window -h -c "#{pane_current_path}"
bind s split-window -v -c "#{pane_current_path}"

# Create new window preserving cwd
bind c new-window -c "#{pane_current_path}"

# Toggle synchronize-panes
bind S set-window-option synchronize-panes \; display-message "synchronize-panes #{?pane_synchronized,ON,OFF}"

# Window navigation
bind -r C-h previous-window
bind -r C-l next-window
bind Tab last-window
bind ` last-window

# Window movement / reordering
bind -r "<" swap-window -d -t -1
bind -r ">" swap-window -d -t +1

# Pane closing / killing
bind x kill-pane
bind X kill-window
bind Q confirm-before -p "Kill session #S? (y/n)" kill-session

# ------------------------------------------------------------------------------
# 3. Vim Navigation & Integration
# ------------------------------------------------------------------------------
# Smart pane switching with awareness of Vim splits.
# Press Alt-h/j/k/l without prefix to navigate panes or Vim windows seamlessly.
is_vim="ps -o state= -o comm= -t '#{pane_tty}' \
    | grep -iqE '^[^TXZ ]+ +(\\S+\\/)?g?(view|l?n?vim?x?|fzf)(diff)?$'"

bind-key -n 'M-h' if-shell "$is_vim" 'send-keys M-h' 'select-pane -L'
bind-key -n 'M-j' if-shell "$is_vim" 'send-keys M-j' 'select-pane -D'
bind-key -n 'M-k' if-shell "$is_vim" 'send-keys M-k' 'select-pane -U'
bind-key -n 'M-l' if-shell "$is_vim" 'send-keys M-l' 'select-pane -R'

# Also support Alt-hjkl inside copy mode
bind-key -T copy-mode-vi 'M-h' select-pane -L
bind-key -T copy-mode-vi 'M-j' select-pane -D
bind-key -T copy-mode-vi 'M-k' select-pane -U
bind-key -T copy-mode-vi 'M-l' select-pane -R

# Standard Prefix + hjkl vi navigation fallback
bind-key h select-pane -L
bind-key j select-pane -D
bind-key k select-pane -U
bind-key l select-pane -R

# Vi-style pane resizing (Prefix + H/J/K/L, repeatable)
bind-key -r H resize-pane -L 5
bind-key -r J resize-pane -D 5
bind-key -r K resize-pane -U 5
bind-key -r L resize-pane -R 5

# ------------------------------------------------------------------------------
# 4. Vi Copy Mode & Clipboard
# ------------------------------------------------------------------------------
setw -g mode-keys vi
bind Escape copy-mode
bind [ copy-mode
bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi V send-keys -X select-line
bind -T copy-mode-vi C-v send-keys -X rectangle-toggle
bind -T copy-mode-vi Escape send-keys -X cancel
bind -T copy-mode-vi H send-keys -X start-of-line
bind -T copy-mode-vi L send-keys -X end-of-line
bind p paste-buffer
bind P choose-buffer

# Copy to system clipboard (supports Wayland and X11)
if-shell "command -v wl-copy >/dev/null 2>&1" \
    'bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "wl-copy"' \
    'bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "xclip -in -selection clipboard"'

# ------------------------------------------------------------------------------
# 5. Base16 Oceanic Next Theme & Powerline Status Bar
# ------------------------------------------------------------------------------
# Oceanic Next Palette:
# base00 (bg):        #1b2b34
# base01 (dark gray): #343d46
# base02 (selection): #4f5b66
# base03 (comments):  #65737e
# base04 (dark text): #a7adba
# base05 (fg text):   #c0c5ce
# base07 (bright fg): #d8dee9
# base08 (red):       #ec5f67
# base09 (orange):    #f99157
# base0A (yellow):    #fac863
# base0B (green):     #99c794
# base0C (cyan):      #5fb3b3
# base0D (blue):      #6699cc
# base0E (purple):    #c594c5

# Status bar general
set -g status on
set -g status-interval 2
set -g status-justify left
set -g status-position bottom
set -g status-style "bg=#1b2b34,fg=#c0c5ce"

# Status left: Session name with powerline arrows
set -g status-left-length 50
set -g status-left "#[fg=#1b2b34,bg=#6699cc,bold] #S #[fg=#6699cc,bg=#343d46,nobold]#[fg=#c0c5ce,bg=#343d46] #(whoami) #[fg=#343d46,bg=#1b2b34,nobold]"

# Status right: Date, time, hostname
set -g status-right-length 120
set -g status-right "#{?pane_synchronized,#[fg=#fac863]#[bg=#1b2b34]#[fg=#1b2b34]#[bg=#fac863]#[bold] SYNC #[nobold]#[fg=#fac863]#[bg=#343d46],}#[fg=#343d46,bg=#1b2b34]#[fg=#a7adba,bg=#343d46] %Y-%m-%d  %H:%M #[fg=#5fb3b3,bg=#343d46]#[fg=#1b2b34,bg=#5fb3b3,bold] #h "

# Window status tabs
setw -g window-status-separator ""
setw -g window-status-format "#[fg=#1b2b34,bg=#1b2b34]#[fg=#65737e,bg=#1b2b34] #I  #W #[fg=#1b2b34,bg=#1b2b34]"
setw -g window-status-current-format "#[fg=#1b2b34,bg=#5fb3b3]#[fg=#1b2b34,bg=#5fb3b3,bold] #I  #W #[fg=#5fb3b3,bg=#1b2b34,nobold]"
setw -g window-status-activity-style "fg=#fac863,bg=#1b2b34,bold"

# Pane borders & active pane visibility
# Thicker border lines and directional arrows pointing to active pane
set -g pane-border-lines heavy
set -g pane-border-indicators both

# Inactive pane border: subtle dark gray
set -g pane-border-style "fg=#343d46"

# Active pane border: bold cyan (matches active tab accent)
set -g pane-active-border-style "fg=#5fb3b3,bold"

# Active pane title badges on border (auto-enabled when multiple panes exist)
set -g pane-border-status off
set -g pane-border-format " #{?pane_active,#[fg=#1b2b34,bg=#5fb3b3,bold] #P  #{pane_current_command}#{?pane_synchronized, 🔗,} #[default],#[fg=#65737e,bg=#343d46,nobold] #P  #{pane_current_command}#{?pane_synchronized, 🔗,} #[default]} "

# Dynamically display pane-border-status only when there are multiple panes and not zoomed
set-hook -g window-layout-changed 'set-window-option -F pane-border-status "#{?#{||:#{==:#{window_panes},1},#{window_zoomed_flag}},off,top}"'
set-window-option -F pane-border-status "#{?#{||:#{==:#{window_panes},1},#{window_zoomed_flag}},off,top}"

# Message and command line styling
set -g message-style "fg=#fac863,bg=#343d46,bold"
set -g message-command-style "fg=#5fb3b3,bg=#343d46,bold"

# Mode styling (copy mode highlight)
setw -g mode-style "fg=#1b2b34,bg=#fac863,bold"

# Clock mode color
setw -g clock-mode-colour "#6699cc"

# ------------------------------------------------------------------------------
# 6. Plugins (TPM)
# ------------------------------------------------------------------------------
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @plugin 'tmux-plugins/tmux-yank'

# Resurrect & Continuum configurations
set -g @resurrect-strategy-nvim 'session'
set -g @resurrect-capture-pane-contents 'on'
set -g @continuum-restore 'on'
set -g @continuum-save-interval '15'

# tmux-yank configuration
set -g @yank_with_mouse on
set -g @yank_selection_mouse 'clipboard'

# Auto-install TPM if missing
if "test ! -d ~/.tmux/plugins/tpm" \
   "run 'git clone https://github.com/tmux-plugins/tpm ~/.tmux/plugins/tpm && ~/.tmux/plugins/tpm/bin/install_plugins'"

# ------------------------------------------------------------------------------
# 7. Local Overrides
# ------------------------------------------------------------------------------
if-shell "[ -f ~/.tmux.conf.local ]" 'source-file ~/.tmux.conf.local'

# Initialize TMUX plugin manager (must stay at the very end of tmux.conf)
run '~/.tmux/plugins/tpm/tpm'
